<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Security Survey</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/survey.css">
</head>
<body>

  <header class="nav">
    <div class="nav-inner">
      <span class="logo">Duane Maas Security Consulting</span>
      <nav>
        <a href="#survey">Survey</a>
        <a href="#responses">Responses</a>
      </nav>
    </div>
  </header>

  <section id="survey" class="section">
    <h2>Cyber Security Survey</h2>
    <p id="status" class="status">Connecting to the survey database…</p>
    <form id="survey-form" hidden>
      <div id="questions"></div>
      <button class="btn" type="submit">Submit response</button>
    </form>
  </section>

  <section id="responses" class="section">
    <h2>Responses</h2>
    <button class="btn btn-secondary" id="refresh" type="button">Refresh</button>
    <div class="table-wrap">
      <table id="responses-table"></table>
    </div>
  </section>

  <script src="/survey.js"></script>
</body>
</html>
